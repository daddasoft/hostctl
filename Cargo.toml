[package]
name = "hostctl"
version = "0.4.2"
edition = "2024"
description = "Safe, cross-platform hosts file management"
license = "MIT"
repository = "https://github.com/daddasoft/hostctl"
readme = "README.md"
keywords = ["hosts", "dns", "cli", "networking"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["fuzz/**"]

[[bin]]
name = "hostctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
criterion = "0.5"
proptest = "1"
tempfile = "3.27.0"

[[bench]]
name = "large_hosts"
harness = false
