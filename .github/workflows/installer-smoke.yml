name: Installer Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hostctl-bin"
          HOSTCTL_INSTALL_DIR="$RUNNER_TEMP/hostctl-bin" sh ./install.sh
          "$RUNNER_TEMP/hostctl-bin/hostctl" --version
      - name: Install and verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "hostctl-bin"
          ./install.ps1 -InstallDir $destination
          & (Join-Path $destination "hostctl.exe") --version
