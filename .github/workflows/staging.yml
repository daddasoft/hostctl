name: Staging

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Staging - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, artifact: hostctl-linux-x86_64 }
          - { name: linux-arm64, os: ubuntu-latest, target: aarch64-unknown-linux-gnu, artifact: hostctl-linux-aarch64 }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, artifact: hostctl-macos-x86_64 }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, artifact: hostctl-macos-aarch64 }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, artifact: hostctl-windows-x86_64.exe }
          - { name: windows-arm64, os: windows-latest, target: aarch64-pc-windows-msvc, artifact: hostctl-windows-aarch64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/hostctl ${{ matrix.artifact }}
      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/hostctl.exe" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 5
