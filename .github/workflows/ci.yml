name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo check --benches
      - run: cargo build --release
      - name: CLI smoke test
        shell: bash
        run: |
          printf '127.0.0.1 localhost\n' > test-hosts
          cargo run -- --hosts test-hosts list
          cargo run -- completion bash > completion.bash
          cargo run -- man --output hostctl.1
