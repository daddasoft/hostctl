name: Release

on:
  push:
    tags:
      - "v*.*.*"   # triggers on v1.0.0, v2.1.3, etc.

permissions:
  contents: write  # needed to create releases & upload assets

jobs:
  build:
    name: Build — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: addhost-linux-x86_64

          - name: macOS (x86_64)
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: addhost-macos-x86_64

          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: addhost-macos-aarch64

          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: addhost-windows-x86_64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # ── Rename the binary to a platform-specific name ──────────────────────
      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/addhost \
             ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target\${{ matrix.target }}\release\addhost.exe" `
                    "${{ matrix.artifact }}"

      # ── Upload as a job artifact (available in the Actions UI) ─────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # ── Create the GitHub Release and attach all binaries ──────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for tag message)
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/   # each artifact goes into artifacts/<name>/

      - name: List downloaded files
        run: find artifacts/ -type f

      - name: Create GitHub Release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: "addhost ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true   # auto-generates changelog from commits
          files: |
            artifacts/addhost-linux-x86_64/addhost-linux-x86_64
            artifacts/addhost-macos-x86_64/addhost-macos-x86_64
            artifacts/addhost-macos-aarch64/addhost-macos-aarch64
            artifacts/addhost-windows-x86_64.exe/addhost-windows-x86_64.exe
